{% extends "classifier/base.html" %}

{% block title %}Results{% endblock %}

{% block content %}
<h1>Results</h1>

<div class="results-grid">
    {% for result in results %}
        {% if result.image %}
            <a href="{% url 'filtered_result' result.id %}">
                <div class="image-box">
                    <img src="{{ result.image.url }}" alt="">
                </div>
            </a>
        {% endif %}
    {% endfor %}
</div>
{% endblock %}
