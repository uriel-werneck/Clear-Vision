{% extends "classifier/base.html" %}

{% block title %}Results{% endblock %}

{% block content %}
<div class="results-container">
    <div class="results-grid">
        {% for result in results %}
            {% if result.original_image %}
                <a href="{% url 'filtered_result' result.id %}" class="result-item">
                    <div class="image-box">
                        <img src="{{ result.original_image.url }}" alt="Filtered Image">
                    </div>
                </a>
            {% endif %}
        {% endfor %}
    </div>
</div>
{% endblock %}
