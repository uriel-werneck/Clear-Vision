{% extends "classifier/base.html" %}
{% load static %}

{% block title %}Clear Vision{% endblock %}

{% block content %}

<div class="upload-container">

    <form method="POST" action="{% url 'home' %}" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Upload box -->
        <label for="imageInput" class="upload-box">
            <img id="preview" src="" alt="" class="image-preview">
            <span id="placeholder-text">Click to choose an image</span>
        </label>

        <input type="file" id="imageInput" name="image" accept="image/*" hidden>

        <!-- Buttons -->
        <div class="button-row">
            <button type="submit" class="btn upload-btn">Upload</button>
            <button type="button" id="clearBtn" class="btn clear-btn">Clear</button>
        </div>
    </form>

</div>

<script src="{% static 'classifier/js/main.js' %}"></script>
{% endblock %}
