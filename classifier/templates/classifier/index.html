<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear-Vision</title>
</head>
<body>
    <h1>Homepage</h1>

    {% if classification %}
        <h2>Last Uploaded Image:</h2>
        <img src="{{ classification.image.url }}" alt="Uploaded Image" style="width:200px; margin-bottom:20px;">
        <p>Classification Result: {{ classification.result }}</p>
    {% endif %}

    <form method="POST" action="{% url 'home' %}" enctype="multipart/form-data">
        {% csrf_token %}
        <img id="preview" src="" alt="" style="display:none; width:200px; margin-bottom:20px;">

        <!-- Input to choose image -->
        <input type="file" id="imageInput" name="image" accept="image/*">

        <br><br>

        <!-- Submit button -->
        <button type="submit">Upload</button>

        <!-- Clear button -->
        <button type="button" id="clearBtn">Clear</button>
    </form>

    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const clearBtn = document.getElementById('clearBtn');

        // Show preview when image is selected
        imageInput.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
            }
        });

        // Clear button logic
        clearBtn.addEventListener('click', function () {
            imageInput.value = "";
            preview.src = "";
            preview.style.display = "none";
        });
    </script>
</body>
</html>
